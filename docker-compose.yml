version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: expo_db
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: expo_digital_ops
      MYSQL_USER: expo_user
      MYSQL_PASSWORD: expo_pass123
    ports:
      - "3306:3306"
    volumes:
      - expo_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expo_backend
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://expo_user:expo_pass123@db:3306/expo_digital_ops"
      JWT_SECRET: expo_jwt_secret_key_2024
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expo_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  expo_db_data:
